apiVersion: asset.sap/v1
kind: Asset
type: cap-app

metadata:
  name: hello-world-cap-app
  version: 1.0.0

sourceRoot: "."

runtime:
  type: cap
  language: nodejs
  version: latest-lts
  framework: cap

provides:
  protocols:
    - http
    - odata-v4
  service:
    protocol: odata-v4
    endpoints:
      - name: greeting
        path: /greeting

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  startup:
    path: /health
    periodSeconds: 5
    failureThreshold: 18
  liveness:
    path: /health
    initialDelaySeconds: 15
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 3
